<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Bodoni+Moda:ital,wght@1,900&family=Bungee+Shade&family=DM+Serif+Display:ital@1&family=Fraunces:ital,wght@1,900&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=Megrim&family=Pixelify+Sans&family=Monoton&family=Playfair+Display:ital,wght@0,900;1,900&family=Rubik+Mono+One&family=Shrikhand&family=Space+Mono&family=Syne:wght@800&family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceae4;--panel:#f8f7f3;--ink:#141414;--mute:#7a766e;--line:#d9d6cd;--acc:#8b5a3c;--shadow:0 24px 70px rgba(0,0,0,.2)}
:root[data-theme="dark"]{--bg:#0d0d0e;--panel:#161617;--ink:#efeee9;--mute:#8a867f;--line:#29292b;--acc:#c4895c;--shadow:0 24px 70px rgba(0,0,0,.75)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;transition:background .4s,color .4s}
header{flex-wrap:wrap;display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);transition:background .4s}
h1{font:400 24px 'Bebas Neue',Inter;letter-spacing:.12em;margin:0 18px 0 0}
#tabs{display:flex;gap:2px;margin-right:auto;flex-wrap:wrap}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;font:600 10px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tab:hover{color:var(--acc);transform:none;border-color:transparent;border-bottom-color:var(--line)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.sec{display:none}.sec.on{display:block;animation:fade .3s}
.sw{display:flex;height:18px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}.sw i{flex:1}
main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line);transition:background .4s}
#stage{display:flex;align-items:center;justify-content:center;padding:28px;min-width:0;min-height:0;position:relative}
#poster{box-shadow:var(--shadow);cursor:grab;touch-action:none;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
#poster:active{cursor:grabbing}
.tip{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute);pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
details{border-bottom:1px solid var(--line)}
details details{border:0}
summary{list-style:none;cursor:pointer;padding:12px 16px;font:600 10px Inter;letter-spacing:.18em;text-transform:uppercase;display:flex;justify-content:space-between;transition:color .2s}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--mute);transition:transform .3s}
details[open]>summary::after{transform:rotate(45deg)}
summary:hover{color:var(--acc)}
details details summary{padding:8px 0;color:var(--mute)}
.body{padding:16px;display:grid;gap:10px;animation:fade .35s}
details details .body{padding:0 0 8px}
#insp{padding:10px 16px 0}
label{display:grid;gap:4px;font-size:11px;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:center}
input,select,textarea,button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 8px;transition:border .2s,background .2s,transform .15s,color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
select{background:var(--panel)}
textarea{resize:vertical;min-height:56px}
input[type=range]{padding:0;border:0;accent-color:var(--acc);width:100%}
input[type=color]{padding:0;height:28px;width:100%;cursor:pointer}
input[type=checkbox]{accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px}
button{cursor:pointer}
button:hover{border-color:var(--acc);transform:translateY(-1px)}
button:active{transform:scale(.97)}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.pri:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#layers{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.li{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:background .2s,border .2s,transform .2s}
.li:hover{transform:translateX(2px)}
.li.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.li.new{animation:fade .4s}
.nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li button{border:0;padding:2px 5px;color:var(--mute)}
.li button:hover{color:var(--acc);transform:none}
.acts{display:flex;opacity:.35;transition:opacity .2s}
.li:hover .acts,.li.on .acts{opacity:1}
.note,.empty{font-size:11px;color:var(--mute);padding:4px 0 12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.modal.on{opacity:1;pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;width:min(360px,90vw);transform:scale(.92) translateY(8px);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.modal.on .card{transform:none}
.card h3{font:400 28px 'Bebas Neue';letter-spacing:.08em;margin:0 0 6px}
.card p{color:var(--mute);margin:0 0 18px}
.danger{background:var(--acc);border-color:var(--acc);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){body{overflow:auto}main{grid-template-columns:1fr}#stage{min-height:70vh}}
@media print{.ui{display:none!important}body,#stage{display:block;padding:0;background:#fff}#poster{width:100vw!important;height:100vh!important;box-shadow:none;animation:none}}
</style>
</head>
<body>
<header class="ui">
  <h1>Poster Generator</h1>
  <nav id="tabs"><button class="tab" data-t="look">Look</button><button class="tab" data-t="layers">Layers</button><button class="tab" data-t="sel">Selected layer</button><button class="tab" data-t="canvas">Canvas</button><button class="tab" data-t="grid">Grid &amp; Guides</button><button class="tab" data-t="rules">Rules &amp; Frame</button></nav>
  <button id="rand">↻ Shuffle</button>
  <button id="exPDF">PDF</button>
  <button id="exPNG" title="2× PNG">PNG</button>
  <button id="exSVG" class="pri">Download SVG</button>
  <button id="theme" aria-label="Toggle light and dark mode">◐</button>
</header>
<main>
  <aside class="ui">
    <div class="sec" data-s="look"><div class="body">
      <label>Style preset (replaces layers)<select id="look"></select></label>
      <label>Words for Shuffle<input id="words" value="MAKING TIME 2018"></label>
      <label>Palette<select id="pal"></select></label>
      <div class="sw" id="sw"></div>
      <label>Custom font (.otf .ttf .woff2)<input type="file" id="ffile" accept=".otf,.ttf,.woff,.woff2"></label>
      <p class="note" style="padding:0">Upload Borges Square Pixel here to use it on the poster. Credit Matteo Bertin (matteobertin.it/borges) when you publish.</p>
    </div></div>
    <div class="sec" data-s="layers"><div class="body">
      <div class="grid2"><button id="addT">+ Text</button><button id="addS">+ Shape</button></div>
      <div class="grid2"><button id="addG">+ Lettering</button><button id="addI">+ Image</button></div>
      <input type="file" id="file" accept="image/*" hidden>
      <ul id="layers"></ul>
    </div></div>
    <div class="sec" data-s="sel"><div id="insp"></div></div>
    <div class="sec" data-s="canvas"><div class="body">
      <label>Format<select id="fmt"><option value="1080x1350">Portrait 4:5 — 1080×1350</option><option value="1080x1920">Story 9:16 — 1080×1920</option><option value="1190x1684">A-series — 1190×1684</option><option value="1080x1620">Poster 2:3 — 1080×1620</option><option value="1080x1440">Poster 3:4 — 1080×1440</option><option value="1200x1200">Square — 1200×1200</option><option value="1920x1080">Wide 16:9 — 1920×1080</option></select></label>
      <div class="grid2"><label>Width<input type="number" id="cw" min="200" max="6000"></label><label>Height<input type="number" id="ch" min="200" max="6000"></label></div>
      <label>Background<input type="color" id="bg"></label>
    </div></div>
    <div class="sec" data-s="grid"><div class="body">
      <label class="chk"><input type="checkbox" id="gshow">Show grid</label>
      <label class="chk"><input type="checkbox" id="snap">Snap dragging to grid (Shift = free)</label>
      <label class="chk"><input type="checkbox" id="gexp">Include grid in export</label>
      <label>Grid style<select id="gtype"><option value="lines">Lines</option><option value="crosses">Crosses</option><option value="dots">Dots</option><option value="baseline">Baseline</option></select></label>
      <div class="grid2"><label>Columns<input type="number" id="gc" min="1" max="48"></label><label>Rows<input type="number" id="gr" min="1" max="48"></label></div>
      <label>Margin<span class="row"><input type="range" id="gm" min="0" max="200"><span id="gmv"></span></span></label>
      <div class="grid2"><label>Colour<input type="color" id="gcol"></label><label>Opacity<input type="range" id="gop" min="0.05" max="1" step="0.01"></label></div>
    </div></div>
    <div class="sec" data-s="rules"><div class="body">
      <label>Rule lines<select id="rules"><option value="none">None</option><option value="h">Horizontal</option><option value="v">Vertical</option><option value="x">Cross grid</option></select></label>
      <label>Rule weight<input type="range" id="rw" min="0.5" max="12" step="0.5"></label>
      <label>Frame width<input type="range" id="fw" min="0" max="80"></label>
      <div class="grid2"><label>Rule colour<input type="color" id="rc"></label><label>Frame colour<input type="color" id="fc"></label></div>
    </div></div>
  </aside>
  <section id="stage"><svg id="poster" xmlns="http://www.w3.org/2000/svg" aria-label="Poster preview"></svg>
    <div class="tip ui">Drag to move · Backspace deletes · Arrows nudge · ⌘/Ctrl+D duplicates</div></section>
</main>
<div class="modal" id="modal"><div class="card"><h3>Delete this layer?</h3><p id="mtxt"></p><div class="grid2"><button id="mno">Cancel</button><button id="myes" class="danger">Delete</button></div></div></div>
<div class="toast" id="toast"></div>

  if(t==='sel')return `<label>${l}<select data-k="${k}">${a.map(f=>`<option ${f===v?'selected':''}>${f}</option>`).join('')}</select></label>`;
  if(t==='col')return `<label>${l}<input type="color" data-k="${k}" value="${v}"></label>`;
  if(t==='chk')return `<label class="chk"><input type="checkbox" data-k="${k}" ${v?'checked':''}>${l}</label>`;
  return `<label>${l}<span class="row"><input type="range" data-k="${k}" min="${a}" max="${b}" step="${c}" value="${v}"><input type="number" data-k="${k}" step="${c}" value="${v}"></span></label>`}
function insp(){

function sync(){const L=cur();if(!L)return;document.querySelectorAll('#insp [data-k]').forEach(e=>{const v=L[e.dataset.k];if(e.type==='checkbox')e.checked=v;else if(document.activeElement!==e)e.value=v})}

function initUI(){$('#fmt').value=S.w+'x'+S.h;$('#cw').value=S.w;$('#ch').value=S.h;$('#bg').value=S.bg;$('#gshow').checked=S.gshow;$('#snap').checked=S.snap;$('#gexp').checked=S.gexp;$('#gtype').value=S.gtype;$('#gc').value=S.gc;$('#gr').value=S.gr;$('#gm').value=S.gm;$('#gmv').textContent=S.gm;$('#gcol').value=S.gcol;$('#gop').value=S.gop;$('#rules').value=S.rules;$('#rw').value=S.rw;$('#rc').value=S.rc;$('#fw').value=S.fw;$('#fc').value=S.fc}

$('#layers').addEventListener('click',e=>{const li=e.target.closest('.li');if(!li)return;const id=+li.dataset.id,a=e.target.dataset.a;
  if(a==='del')ask(id);else if(a==='up')move(id,1);else if(a==='dn')move(id,-1);else if(a==='dup')dup(id);
  else if(a==='vis'){const L=S.layers.find(l=>l.id===id);L.vis=!L.vis;list();render()}else select(id)});

['cw','ch'].forEach(i=>$('#'+i).oninput=()=>{S.w=+$('#cw').value||S.w;S.h=+$('#ch').value||S.h;render()});

[['gshow','checked'],['snap','checked'],['gexp','checked'],['gtype','value'],['gc','value'],['gr','value'],['gm','value'],['gcol','value'],['gop','value'],['rules','value'],['rw','value'],['rc','value'],['fw','value'],['fc','value']].forEach(([k,p])=>$('#'+k).oninput=e=>{let v=e.target[p];if(['gc','gr','gm','gop','rw','fw'].includes(k))v=+v||(k==='gm'||k==='fw'?0:1);S[k]=v;if(k==='gm')$('#gmv').textContent=v;render()});
$('#insp').addEventListener('input',e=>{const k=e.target.dataset.k,L=cur();if(!k||!L)return;
  let v=e.target.type==='checkbox'?e.target.checked:(e.target.type==='range'||e.target.type==='number')?parseFloat(e.target.value):e.target.value;if(v!==v)return;
  L[k]=v;if(k==='text'){L.name=v.split('\n')[0].slice(0,18)||'Text';list()}
  if(e.target.closest('.row'))e.target.closest('.row').querySelectorAll('input').forEach(x=>x.value=v);render()});

// drag + snap
const pt=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
const snapTo=(v,a)=>{let b=v,d=14;a.forEach(n=>{if(Math.abs(n-v)<d){d=Math.abs(n-v);b=n}});return b};
svg.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-id]');if(!g){select(null);return}const id=+g.dataset.id;if(id!==S.sel)select(id);const L=cur(),p=pt(e);drag={ox:L.x-p.x,oy:L.y-p.y};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const L=cur(),p=pt(e);let x=p.x+drag.ox,y=p.y+drag.oy;if(S.snap&&!e.shiftKey){x=snapTo(x,colsX());y=snapTo(y,rowsY())}L.x=Math.round(x);L.y=Math.round(y);render();sync()});
svg.addEventListener('pointerup',()=>drag=null);
addEventListener('keydown',e=>{
  if($('#modal').classList.contains('on')){if(e.key==='Escape')closeM();if(e.key==='Enter'){e.preventDefault();del()}return}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const L=cur();if(!L)return;
  if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();ask(L.id)}
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){e.preventDefault();dup(L.id)}
  else if(e.key.startsWith('Arrow')){e.preventDefault();const n=e.shiftKey?10:1;if(e.key==='ArrowLeft')L.x-=n;if(e.key==='ArrowRight')L.x+=n;if(e.key==='ArrowUp')L.y-=n;if(e.key==='ArrowDown')L.y+=n;render();sync()}});

$('#exSVG').onclick=()=>{

  const out=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${S.w}" height="${S.h}" viewBox="0 0 ${S.w} ${S.h}"><style>${css}${cfCSS()}</style>${build(true)}</svg>`;

// PNG export (fonts are embedded so the rasterised SVG matches the preview)
const GF={'Bodoni Moda':'Bodoni+Moda:ital,wght@1,900','Playfair Display':'Playfair+Display:ital,wght@0,900;1,900','Fraunces':'Fraunces:ital,wght@1,900','DM Serif Display':'DM+Serif+Display:ital@1','Abril Fatface':'Abril+Fatface','Instrument Serif':'Instrument+Serif:ital@1','Shrikhand':'Shrikhand','Monoton':'Monoton','Pixelify Sans':'Pixelify+Sans','Megrim':'Megrim','Bungee Shade':'Bungee+Shade','Rubik Mono One':'Rubik+Mono+One','Unbounded':'Unbounded:wght@900','Syne':'Syne:wght@800','Anton':'Anton','Archivo Black':'Archivo+Black','Bebas Neue':'Bebas+Neue','Inter':'Inter:wght@600','Space Mono':'Space+Mono'};
const cfCSS=()=>CF.map(f=>`@font-face{font-family:'${f.name}';src:url(${f.url})}`).join('');
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
async function fontCSS(){
  const used=[...new Set(S.layers.filter(l=>l.vis&&l.type==='text').map(l=>l.font))].filter(f=>GF[f]);let css=cfCSS();if(!CF.length&&S.layers.some(l=>l.font==='Borges Square Pixel'))used.push('Pixelify Sans');
  for(const f of used){try{
    const t=await(await fetch('https://fonts.googleapis.com/css2?family='+GF[f]+'&display=swap')).text();
    for(const m of t.matchAll(/\/\* latin \*\/\s*(@font-face\s*\{[^}]*\})/g)){
      let b=m[1];const u=b.match(/url\(([^)]+)\)/);
      if(u)b=b.replace(u[1],await b64(await(await fetch(u[1])).blob()));
      css+=b}
  }catch(e){}}
  return css}
$('#ffile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  const name=/borges/i.test(f.name)?'Borges Square Pixel':f.name.replace(/\.[^.]+$/,'');
  const url=await b64(f);
  try{const ff=new FontFace(name,`url(${url})`);await ff.load();document.fonts.add(ff)}catch(err){toast('Could not read that font');return}
  CF=CF.filter(c=>c.name!==name);CF.push({name,url});if(!FONTS.includes(name))FONTS.push(name);
  e.target.value='';insp();render();toast(name+' loaded')};
$('#exPNG').onclick=async()=>{
  toast('Rendering PNG…');const sv=S.sel;
  const out=`<svg xmlns="http://www.w3.org/2000/svg" width="${S.w*2}" height="${S.h*2}" viewBox="0 0 ${S.w} ${S.h}"><style>${await fontCSS()}</style>${build(true)}</svg>`;
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=S.w*2;c.height=S.h*2;c.getContext('2d').drawImage(img,0,0);
    c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='poster.png';a.click();toast('PNG downloaded')})};
  img.onerror=()=>toast('PNG export failed — try SVG');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(out)};
