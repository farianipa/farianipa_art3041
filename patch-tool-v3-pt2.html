<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patch Tool v3 Pt. 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500&family=DM+Sans:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap">
<style>
:root{--bg:#f6f4ef;--side:#efebe3;--glow:#ffffff;--ink:#000;--line:#d8cfc0;--acc:#8b5e3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="dark"]{color-scheme:dark;--bg:#10131c;--side:#151a27;--glow:#1b2236;--ink:#fff;--line:#3a4157;--acc:#c9955f}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cabin,"Gill Sans","Helvetica Neue",Arial,sans-serif;font-weight:400}
header{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--line)}
h1{font-family:"Gill Sans","Gill Sans MT",Cabin,Calibri,sans-serif;font-size:27px;font-weight:500;margin:0;white-space:nowrap}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button,#theme{font:inherit;font-weight:400;font-size:13px;text-transform:lowercase;background:none;border:0;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;opacity:.65;transition:opacity .2s,background .2s}
nav button:hover,#theme:hover{opacity:1;background:var(--side)}
#theme{border:1px solid var(--line)}
#ver{margin-left:auto;font-size:13px;font-weight:400;text-transform:lowercase}
header .act{margin:0;padding:6px 18px}
.app{display:flex}
aside{width:310px;flex:none;box-sizing:border-box;background:var(--side);padding:20px 26px 48px;height:calc(100vh - 64px);position:sticky;top:0;overflow-y:auto;box-shadow:16px 0 44px -26px rgba(0,0,0,.28)}
h3{font-weight:400;font-size:13px;text-transform:lowercase;margin:26px 0 10px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
main{flex:1;min-width:0;padding:34px 16px 70px;text-align:center;background:radial-gradient(ellipse at 50% 28%,var(--glow),transparent 68%)}
#stage{transition:opacity .18s ease,transform .18s ease}#stage.swap{opacity:0;transform:scale(.97)}
#stage svg{width:min(92vw,460px);height:auto;filter:drop-shadow(0 22px 24px rgba(0,0,0,.2))}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.row label{width:92px;flex:none;font-weight:400;text-transform:lowercase}
.row select,.row input[type=text]{flex:1;min-width:0;font:inherit;font-weight:400;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-transform:lowercase}
.row select option{background:var(--bg);color:var(--ink)}
.row select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.row input[type=range],.row input[type=checkbox]{accent-color:var(--ink)}
.row input[type=range]{flex:1;min-width:0}
.row input[type=file]{flex:1;min-width:0;font-size:12px;color:var(--ink)}
.act{font:inherit;font-weight:400;font-size:13px;text-transform:lowercase;padding:9px 22px;border-radius:999px;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer;margin:5px;transition:transform .15s}
.act:hover{transform:translateY(-1px)}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.hint{font-size:12px;margin:10px 0;line-height:1.6;font-weight:400;text-transform:lowercase}
#small{width:96px;height:96px;margin:6px auto}#small svg{width:96px;height:96px}
#saved{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}#saved div{width:84px;cursor:pointer;transition:transform .15s}#saved div:hover{transform:scale(1.06)}#saved svg{width:84px;height:84px}
@media (max-width:760px){.app{flex-direction:column}aside{width:auto;height:auto;position:static}}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-left:-12px}.back{font-size:13px;text-transform:lowercase;color:var(--ink);opacity:.65;text-decoration:none}.back:hover{opacity:1}
.arch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 22px}
.arch button{font:inherit;font-size:13px;text-transform:lowercase;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;transition:border-color .2s}
.arch button:hover{border-color:var(--ink)}
.tools{margin-top:14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tools label{text-transform:lowercase}
.mini{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;margin-left:6px}
.lockbar{display:flex;align-items:center;font-size:12px;margin-bottom:6px;text-transform:lowercase}.lockbar span{margin-right:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}.modal.on{display:flex}
.box{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto;text-align:center}
#g9{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}#g9 div{cursor:pointer;transition:transform .15s}#g9 div:hover{transform:scale(1.04)}#g9 svg{width:100%;height:auto}
</style>
</head>
<body>
<header>
<h1>Mission Patch Generator</h1><span class="tag">v3 · pt. 2</span><a class="back" href="index.html">← index</a>
<span id="ver">version 0</span>
<button class="act" onclick="save()">save</button>
<button id="theme" onclick="theme()">light / dark</button>
</header>
<div class="app">
<aside id="controls"></aside>
<main>
<div class="arch" id="arch"></div>
<div class="tools" style="margin:0 0 14px"><button class="act" id="pp" onclick="toggle()">pause</button><button class="act" onclick="exportGif()">export gif</button><button class="act" onclick="exportWebm()">export webm</button></div>
<p class="hint" id="st" style="min-height:18px"></p>
<div id="stage"></div>
<button class="act pri" onclick="gen()">generate</button>
<button class="act" onclick="gen(1)">wildcard</button>
<button class="act" onclick="grid9()">9 variations</button>
<button class="act" onclick="reset()">reset</button>
<div class="tools"><label><input type="checkbox" id="gridck"> construction grid</label><button class="act" onclick="dl('png')">export png</button><button class="act" onclick="dl('svg')">export svg</button></div>
<p class="hint">seed <span id="seed">·</span> · 1-inch size check</p>
<div id="small"></div>
<h3>saved versions</h3>
<div id="saved"></div>
</main>
</div>
<script>
var PAL=[
{n:"Baruch blue + gold",bg:"#0b2a6f",ring:"#f2c14e",p1:"#f2c14e",p2:"#ffffff",c:"#e4572e"},
{n:"Midnight + coral",bg:"#14213d",ring:"#ff8fa3",p1:"#ff8fa3",p2:"#ffd6e0",c:"#ffe66d"},
{n:"Ocean blue",bg:"#0a1f44",ring:"#8ec5ff",p1:"#8ec5ff",p2:"#e8f3ff",c:"#ffffff"},
{n:"Black + red",bg:"#0d0d0d",ring:"#e63946",p1:"#e63946",p2:"#ffd9dc",c:"#ffffff"},
{n:"Teal + cream",bg:"#0f4c4a",ring:"#f4ead5",p1:"#f4ead5",p2:"#f2a65a",c:"#f2a65a"}];
var FONTS={"DM Sans":"'DM Sans',Arial,sans-serif","Gill Sans":"'Gill Sans','Gill Sans MT',Cabin,Calibri,sans-serif","Cormorant Garamond":"'Cormorant Garamond',Georgia,serif","Georgia":"Georgia,serif"};
var TCOL={"Match ring":0,"White":"#ffffff","Cream":"#f4ead5"};
var GT={patch:"patch",flower:"flower",logo:"baruch logo",text:"type"};
var C=[
{g:"patch",k:"shape",l:"Shape",t:"s",o:["Circle","Rounded square"],d:"Rounded square"},
{g:"patch",k:"pal",l:"Colors",t:"s",o:PAL.map(function(p){return p.n}),d:PAL[1].n},
{g:"patch",k:"fill",l:"Finish",t:"s",o:["Soft fill","Flat lines"],d:"Soft fill"},
{g:"patch",k:"border",l:"Border",t:"s",o:["Single","Double"],d:"Single"},
{g:"patch",k:"bw",l:"Border width",t:"r",min:3,max:12,d:6},
{g:"patch",k:"bg",l:"Background",t:"s",o:["Solid","Glow"],d:"Solid"},
{g:"patch",k:"stars",l:"Stars",t:"s",o:["Off","Few","Many"],d:"Off"},
{g:"flower",k:"n",l:"Petals",t:"r",min:4,max:14,d:8},
{g:"flower",k:"layers",l:"Layers",t:"s",o:["1","2","3"],d:"1"},
{g:"flower",k:"pshape",l:"Petal shape",t:"s",o:["Oval","Pointed","Round"],d:"Oval"},
{g:"flower",k:"rx",l:"Petal width",t:"r",min:20,max:56,d:56},
{g:"flower",k:"ry",l:"Petal length",t:"r",min:50,max:80,d:80},
{g:"flower",k:"w",l:"Line weight",t:"r",min:1,max:6,d:1},
{g:"flower",k:"rot",l:"Rotation",t:"r",min:0,max:45,d:0},
{g:"flower",k:"inner",l:"Inner orbit",t:"s",o:["On","Off"],d:"On"},
{g:"flower",k:"ring",l:"Orbit ring",t:"s",o:["Off","On"],d:"Off"},
{g:"flower",k:"planet",l:"Planets",t:"s",o:["At tips","Large","Off"],d:"At tips"},
{g:"flower",k:"core",l:"Center",t:"s",o:["Sun","Ring","Dot"],d:"Sun"},
{g:"logo",k:"logo",l:"Position",t:"s",o:["Center","Bottom","Off"],d:"Off"},
{g:"logo",k:"lsz",l:"Size",t:"r",min:24,max:44,d:34},
{g:"logo",k:"back",l:"Backing",t:"s",o:["White disc","None"],d:"White disc"},
{g:"text",k:"top",l:"Top text",t:"x",d:"BARUCH COLLEGE"},
{g:"text",k:"bot",l:"Bottom text",t:"x",d:"SSEP MISSION 2026"},
{g:"text",k:"font",l:"Font",t:"s",o:Object.keys(FONTS),d:"Cormorant Garamond"},
{g:"text",k:"tsize",l:"Text size",t:"r",min:13,max:22,d:18},
{g:"text",k:"tsp",l:"Spacing",t:"r",min:1,max:8,d:5},
{g:"text",k:"tcol",l:"Text color",t:"s",o:Object.keys(TCOL),d:"Match ring"}];
var TABS=["patch","flower","logo","text"],S={},L={},seed=0,logoURL="",saved=[];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function reset(){C.forEach(function(c){S[c.k]=c.d;L[c.k]=false});build();draw()}
function row(c){
 var h='<div class="row"><label>'+c.l+'</label>';
 if(c.t=="s")h+='<select data-k="'+c.k+'">'+c.o.map(function(o){return '<option'+(o==S[c.k]?' selected':'')+'>'+o+'</option>'}).join("")+'</select>';
 else if(c.t=="r")h+='<input type="range" data-k="'+c.k+'" min="'+c.min+'" max="'+c.max+'" value="'+S[c.k]+'">';
 else h+='<input type="text" data-k="'+c.k+'" value="'+S[c.k]+'" maxlength="28">';
 if(c.t!="x")h+='<input type="checkbox" title="Lock" data-lk="'+c.k+'"'+(L[c.k]?' checked':'')+'>';
 return h+'</div>'}
function build(){
 var h='<div class="lockbar"><span id="lc"></span><button class="mini" onclick="lockAll(1)">lock all</button><button class="mini" onclick="lockAll(0)">unlock all</button></div>';
 TABS.forEach(function(g){
  h+=(g=="patch"?'':'<hr>')+C.filter(function(c){return c.g==g}).map(row).join("");
  if(g=="logo")h+='<div class="row"><label>Logo file</label><input type="file" id="logo" accept="image/*"></div><p class="hint">upload your baruch logo file. until then a placeholder “B” sits in its spot.</p>'});
 h+='<p class="hint">tick a box to lock a setting. it stays put when you generate.</p>';
 var el=document.getElementById("controls");el.innerHTML=h;
 el.querySelectorAll("[data-k]").forEach(function(i){i.oninput=function(){var c=C.filter(function(x){return x.k==i.dataset.k})[0];S[c.k]=c.t=="r"?+i.value:i.value;draw()}});
 el.querySelectorAll("[data-lk]").forEach(function(i){i.onchange=function(){L[i.dataset.lk]=i.checked;updLc()}});updLc();
 document.getElementById("logo").onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){logoURL=r.result;draw()};r.readAsDataURL(f)};
}
function jump(t){document.getElementById("sec-"+t).scrollIntoView({behavior:"smooth",block:"start"})}
function theme(){var r=document.documentElement;r.dataset.mode=r.dataset.mode=="dark"?"light":"dark"}
function gen(w){
 seed=Math.floor(Math.random()*99999);var R=rng(seed);
 C.forEach(function(c){if((L[c.k]&&!w)||c.t=="x")return;
  if(c.t=="s")S[c.k]=c.o[Math.floor(R()*c.o.length)];
  else S[c.k]=c.min+Math.floor(R()*(c.max-c.min+1))});
 var st=document.getElementById("stage");st.classList.add("swap");
 setTimeout(function(){build();draw();setTimeout(function(){st.classList.remove("swap")},40)},180)}
function shape(inset,a){
 return S.shape=="Circle"?'<circle cx="200" cy="200" r="'+(195-inset)+'" '+a+'/>':'<rect x="'+(5+inset)+'" y="'+(5+inset)+'" width="'+(390-2*inset)+'" height="'+(390-2*inset)+'" rx="'+(80-inset)+'" '+a+'/>'}
function mark(cx,cy,r,p){
 var w=S.back=="White disc",s=w?'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff"/>':'';
 if(logoURL)s+='<image href="'+logoURL+'" x="'+(cx-r*.78)+'" y="'+(cy-r*.78)+'" width="'+(r*1.56)+'" height="'+(r*1.56)+'" preserveAspectRatio="xMidYMid meet"/>';
 else s+='<text x="'+cx+'" y="'+(cy+r*.36)+'" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="'+(r*1.1)+'" fill="'+(w?"#0b2a6f":p.ring)+'">B</text>';
 return s}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function petal(col,ry,g){
 var rx=S.rx,a='fill="'+col+'" fill-opacity="'+(S.fill=="Soft fill"?.15:0)+'" stroke="'+col+'" stroke-width="'+S.w+'"'+g;
 if(S.pshape=="Pointed")return '<path d="M200,200 C'+(200-rx*1.3)+','+(200-ry*.6)+' '+(200-rx*.5)+','+(200-ry*1.7)+' 200,'+(200-2*ry)+' C'+(200+rx*.5)+','+(200-ry*1.7)+' '+(200+rx*1.3)+','+(200-ry*.6)+' 200,200Z" '+a+'/>';
 if(S.pshape=="Round")return '<circle cx="200" cy="'+(200-ry)+'" r="'+(Math.min(rx,ry)*.8)+'" '+a+'/>';
 return '<ellipse cx="200" cy="'+(200-ry)+'" rx="'+rx+'" ry="'+ry+'" '+a+'/>'}
function svg(uid,ph){
 var p=PAL.filter(function(x){return x.n==S.pal})[0],n=S.n,ry=S.ry,bottom=S.logo=="Bottom",fs=bottom?.78:.92,cy=bottom?188:200,f=FONTS[S.font],tc=TCOL[S.tcol]||p.ring;
 var s='<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Orbit Bloom mission patch">';
 s+='<defs><path id="a'+uid+'" d="M42,200 A158,158 0 0 1 358,200"/><path id="b'+uid+'" d="M24,200 A176,176 0 0 0 376,200"/><radialGradient id="gl'+uid+'"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>';
 s+=shape(0,'fill="'+p.ring+'"')+shape(S.bw,'fill="'+p.bg+'"');
 if(S.bg=="Glow")s+=shape(S.bw,'fill="url(#gl'+uid+')"');
 if(S.border=="Double")s+=shape(S.bw+4,'fill="none" stroke="'+p.ring+'" stroke-width="1.5"');
 if(S.stars!="Off"){var R2=rng(11),cnt=S.stars=="Few"?14:36;for(var j=0;j<cnt;j++){var an=R2()*6.283,rr=30+R2()*135;s+='<circle cx="'+(200+rr*Math.cos(an)).toFixed(1)+'" cy="'+(200+rr*Math.sin(an)).toFixed(1)+'" r="'+(.7+R2()*1.2).toFixed(1)+'" fill="'+p.p2+'" opacity="'+(.45+.45*Math.sin(6.2832*((ph||0)+j/cnt))).toFixed(2)+'"/>'}}
 s+='<g transform="translate(200 '+cy+') scale('+fs+') rotate('+(+S.rot+(ph||0)*360/n)+') translate(-200 -200)">';
 if(S.ring=="On")s+='<circle cx="200" cy="200" r="'+(2*ry)+'" fill="none" stroke="'+p.p2+'" stroke-width="1" opacity=".5"/>';
 for(var l=0;l<+S.layers;l++){
  var sc=1-.3*l,col=l%2?p.p2:p.p1;
  for(var i=0;i<n;i++){var g=' transform="rotate('+(i*360/n+l*180/n)+' 200 200) translate(200 200) scale('+sc+') translate(-200 -200)"';
   s+=petal(col,ry,g);
   if(l==0){
    if(S.inner=="On")s+='<ellipse cx="200" cy="'+(200-ry*.55)+'" rx="'+(S.rx*.55)+'" ry="'+(ry*.55)+'" fill="none" stroke="'+p.p2+'" stroke-width="'+S.w+'"'+g+'/>';
    if(S.planet!="Off")s+='<circle cx="200" cy="'+(200-2*ry)+'" r="'+(S.planet=="Large"?11:7)+'" fill="'+p.p2+'"'+g+'/>'}}}
 if(S.logo!="Center"){
  if(S.core=="Sun")s+='<circle cx="200" cy="200" r="'+(22*(1+.08*Math.sin(6.2832*(ph||0))))+'" fill="'+p.c+'"/>';
  else if(S.core=="Ring")s+='<circle cx="200" cy="200" r="22" fill="none" stroke="'+p.c+'" stroke-width="'+S.w+'"/>';
  else s+='<circle cx="200" cy="200" r="10" fill="'+p.c+'"/>'}
 s+='</g>';
 if(S.logo=="Center")s+=mark(200,200,S.lsz,p);
 if(bottom)s+=mark(200,340,S.lsz*.78,p);
 var tf='font-family="'+f+'" font-size="'+S.tsize+'" font-weight="400" letter-spacing="'+S.tsp+'" fill="'+tc+'" text-anchor="middle"';
 if(S.top)s+='<text '+tf+'><textPath href="#a'+uid+'" startOffset="50%">'+esc(S.top)+'</textPath></text>';
 if(S.bot&&!bottom)s+='<text '+tf+'><textPath href="#b'+uid+'" startOffset="50%">'+esc(S.bot)+'</textPath></text>';

 if(GRID&&uid=="m")s+='<g stroke="'+p.p2+'" stroke-opacity=".4" stroke-width=".7" fill="none" stroke-dasharray="3 3"><path d="M200 0V400M0 200H400M0 0L400 400M400 0L0 400"/><circle cx="200" cy="200" r="60"/><circle cx="200" cy="200" r="120"/><circle cx="200" cy="200" r="160"/></g>';
 return s+'</svg>'}
var pend=0,PH=0,playing=true,t0=0,PERIOD=7000;
function renderNow(){document.getElementById("stage").innerHTML=svg("m",PH);document.getElementById("small").innerHTML=svg("s",PH);document.getElementById("seed").textContent=seed||"\u00b7"}
function draw(){if(playing||pend)return;pend=1;requestAnimationFrame(function(){pend=0;renderNow()})}
function tick(ts){if(!playing)return;if(!t0)t0=ts;PH=((ts-t0)%PERIOD)/PERIOD;renderNow();requestAnimationFrame(tick)}
function toggle(){playing=!playing;document.getElementById("pp").textContent=playing?"pause":"play";if(playing){t0=0;requestAnimationFrame(tick)}else draw()}
function msg(x){document.getElementById("st").textContent=x}
function save(){
 var snap=JSON.parse(JSON.stringify(S));saved.push(snap);
 var d=document.createElement("div");d.innerHTML=svg("v"+saved.length);
 d.onclick=function(){S=JSON.parse(JSON.stringify(snap));build();draw()};
 document.getElementById("saved").appendChild(d);document.getElementById("ver").textContent="version "+saved.length}
var GRID=false;
var AR=[
{n:"original sketch",o:{}},
{n:"crystal",o:{n:12,rx:30,w:1,layers:"3",pshape:"Pointed",fill:"Flat lines",stars:"Many",pal:"Ocean blue",inner:"Off"}},
{n:"orbital radar",o:{n:6,rx:22,w:2,ring:"On",planet:"Large",pal:"Teal + cream",stars:"Few",shape:"Circle",border:"Double"}},
{n:"eclipse",o:{n:10,rx:44,pshape:"Round",layers:"2",bg:"Glow",border:"Double",pal:"Black + red",shape:"Circle"}},
{n:"night garden",o:{n:9,rx:50,pshape:"Pointed",layers:"2",stars:"Few",border:"Double",pal:"Baruch blue + gold"}}];
function arch(){document.getElementById("arch").innerHTML=AR.map(function(a,i){return '<button onclick="applyArch('+i+')">'+a.n+'</button>'}).join("")}
function applyArch(i){C.forEach(function(c){if(L[c.k])return;S[c.k]=AR[i].o.hasOwnProperty(c.k)?AR[i].o[c.k]:c.d});build();draw()}
function updLc(){var n=Object.keys(L).filter(function(k){return L[k]}).length,e=document.getElementById("lc");if(e)e.textContent=n+" locked"}
function lockAll(v){C.forEach(function(c){if(c.t!="x")L[c.k]=!!v});build()}
function svgFor(st,u){var o=S;S=st;var r=svg(u);S=o;return r}
function grid9(){var g=document.getElementById("g9");g.innerHTML="";
 for(var k=0;k<9;k++){var R=rng(Math.floor(Math.random()*99999)),st=JSON.parse(JSON.stringify(S));
  C.forEach(function(c){if(L[c.k]||c.t=="x")return;if(c.t=="s")st[c.k]=c.o[Math.floor(R()*c.o.length)];else st[c.k]=c.min+Math.floor(R()*(c.max-c.min+1))});
  var d=document.createElement("div");d.innerHTML=svgFor(st,"g"+k);
  (function(s2){d.onclick=function(){S=JSON.parse(JSON.stringify(s2));build();draw();closeM()}})(st);g.appendChild(d)}
 document.getElementById("modal").classList.add("on")}
function closeM(){document.getElementById("modal").classList.remove("on")}
function dlBlob(b,n){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click()}
function frameImg(ph,sz){return new Promise(function(res){var x=svg("f",ph).replace("<svg ",'<svg width="'+sz+'" height="'+sz+'" '),im=new Image();im.onload=function(){res(im)};im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x)})}
function lzw(data){var clr=256,eoi=257,next=258,size=9,dict=new Map(),buf=0,bits=0,out=[];
 function put(c){buf|=c<<bits;bits+=size;while(bits>=8){out.push(buf&255);buf>>=8;bits-=8}}
 put(clr);var cur=data[0];
 for(var i=1;i<data.length;i++){var k=data[i],key=(cur<<8)|k;
  if(dict.has(key))cur=dict.get(key);
  else{put(cur);if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++}else{put(clr);dict.clear();next=258;size=9}cur=k}}
 put(cur);put(eoi);if(bits>0)out.push(buf&255);return out}
function gifEnc(w,h,frames,delay){var o=[];function p(){for(var i=0;i<arguments.length;i++)o.push(arguments[i])}function w2(v){p(v&255,(v>>8)&255)}
 "GIF89a".split("").forEach(function(c){p(c.charCodeAt(0))});w2(w);w2(h);p(247,0,0);
 for(var i=0;i<256;i++)p(Math.round((i>>5)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3));
 p(33,255,11);"NETSCAPE2.0".split("").forEach(function(c){p(c.charCodeAt(0))});p(3,1,0,0,0);
 frames.forEach(function(f){p(33,249,4,9,delay&255,delay>>8,255,0);p(44);w2(0);w2(0);w2(w);w2(h);p(0);p(8);
  var d=lzw(f);for(var i=0;i<d.length;i+=255){var ch=d.slice(i,i+255);p(ch.length);for(var j=0;j<ch.length;j++)o.push(ch[j])}p(0)});
 p(59);return new Uint8Array(o)}
async function exportGif(){var N=48,sz=400,fr=[],c=document.createElement("canvas");c.width=c.height=sz;var cx=c.getContext("2d",{willReadFrequently:true});
 for(var i=0;i<N;i++){msg("rendering gif "+(i+1)+"/"+N);var im=await frameImg(i/N,sz);cx.clearRect(0,0,sz,sz);cx.drawImage(im,0,0,sz,sz);
  var d=cx.getImageData(0,0,sz,sz).data,ix=new Uint8Array(sz*sz);
  for(var j=0;j<ix.length;j++){var o=j*4,v;if(d[o+3]<128)v=255;else{v=((d[o]>>5)<<5)|((d[o+1]>>5)<<2)|(d[o+2]>>6);if(v==255)v=254}ix[j]=v}
  fr.push(ix)}
 dlBlob(new Blob([gifEnc(sz,sz,fr,8)],{type:"image/gif"}),"mission-patch.gif");msg("gif saved")}
async function exportWebm(){if(!window.MediaRecorder){msg("webm export isn\u2019t supported in this browser");return}
 var N=96,sz=600,fps=24,bm=[],c=document.createElement("canvas");c.width=c.height=sz;var cx=c.getContext("2d");
 for(var i=0;i<N;i++){msg("rendering video "+(i+1)+"/"+N);bm.push(await createImageBitmap(await frameImg(i/N,sz)))}
 var bg=getComputedStyle(document.body).backgroundColor,mt=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":"video/webm";
 var rec=new MediaRecorder(c.captureStream(fps),{mimeType:mt,videoBitsPerSecond:6000000}),ch=[];rec.ondataavailable=function(e){ch.push(e.data)};
 rec.onstop=function(){dlBlob(new Blob(ch,{type:"video/webm"}),"mission-patch.webm");msg("webm saved")};
 var k=0;msg("recording\u2026");rec.start();
 var iv=setInterval(function(){if(k>=N){clearInterval(iv);rec.stop();return}cx.fillStyle=bg;cx.fillRect(0,0,sz,sz);cx.drawImage(bm[k++],0,0)},1000/fps)}

 im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x)}
