<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOM FORD BEAUTY — INDISCREET</title>
    <style>
        :root {
            --bg-color: #F9F9F7;
            --tf-gold: #B59A57;
            --accent-crimson: #63000E;
            --obsidian: #000000;
            --muted-text: #6E6D69;
            --border-color: #E5E5E2;
            --pure-white: #FFFFFF;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            background-color: var(--bg-color);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--obsidian);
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            letter-spacing: 0.04em;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* Full-Viewport Minimalist Hero */
        header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
            position: relative;
        }

        .brand-subtitle {
            font-size: clamp(12px, 1.3vw, 16px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            color: var(--obsidian);
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(44px, 8.5vw, 115px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0;
            color: var(--tf-gold);
            line-height: 1;
        }

        .doc-title {
            font-size: 10px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--muted-text);
            margin-top: 26px;
        }

        .hero-nav {
            position: absolute;
            bottom: 44px;
            display: flex;
            gap: 36px;
        }

        .hero-nav a {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--obsidian);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .hero-nav a:hover {
            color: var(--tf-gold);
            border-color: var(--tf-gold);
        }

        /* Editorial Whitespace Layout */
        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 32px 160px 32px;
        }

        section {
            border-top: 1px solid var(--border-color);
            padding: 130px 0;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 72px;
        }

        h2 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin: 0;
            color: var(--tf-gold);
        }

        /* Minimal View Switchers */
        .view-toggle {
            display: inline-flex;
            border: 1px solid var(--border-color);
            background: var(--pure-white);
        }

        .toggle-btn {
            background: transparent;
            border: none;
            padding: 9px 18px;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--muted-text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--obsidian);
            color: var(--pure-white);
        }

        /* Gallery Grids */
        .two-up {
            display: grid;
            grid-template-columns: 1fr;
            gap: 64px;
        }

        @media (min-width: 780px) {
            .two-up {
                grid-template-columns: repeat(2, 1fr);
                gap: 72px;
            }
        }

        .single-feature {
            max-width: 520px;
            margin: 0 auto;
        }

        .plate {
            cursor: zoom-in;
        }

        .media-frame {
            background: var(--obsidian);
            overflow: hidden;
            position: relative;
        }

        .media-frame img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .plate:hover .media-frame img {
            transform: scale(1.015);
        }

        .plate-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-top: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .plate-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--obsidian);
        }

        .plate-format {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--tf-gold);
        }

        /* Architectural Billboard In-Situ View */
        .insitu-scene {
            display: none;
            background: #080808;
            padding: 64px 24px 0 24px;
            justify-content: center;
            align-items: flex-end;
            border: 1px solid #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .insitu-scene.active {
            display: flex;
        }

        .building-facade {
            background: #141414;
            border-top: 2px solid #262626;
            border-left: 1px solid #1f1f1f;
            border-right: 1px solid #1f1f1f;
            padding: 36px 36px 56px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.9);
        }

        .billboard-rig {
            border: 4px solid #000000;
            box-shadow: 0 0 40px rgba(181, 154, 87, 0.14);
            background: #000000;
        }

        .billboard-rig img {
            width: 100%;
            height: auto;
            display: block;
        }

        .spotlights {
            display: flex;
            justify-content: space-around;
            padding-top: 12px;
        }

        .spotlights span {
            width: 24px;
            height: 3px;
            background: var(--tf-gold);
            opacity: 0.65;
            box-shadow: 0 -8px 18px rgba(181, 154, 87, 0.5);
        }

        /* Instagram Feed Post UI Frame */
        .ig-card {
            background: var(--pure-white);
            border: 1px solid transparent;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

            border-color: var(--border-color);
            box-shadow: 0 12px 36px rgba
