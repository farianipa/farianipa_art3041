<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOM FORD BEAUTY — INDISCREET</title>
    <style>
        :root {
            --bg-color: #F9F9F7;
            --tf-gold: #B59A57;
            --accent-crimson: #63000E;
            --obsidian: #000000;
            --muted-text: #6E6D69;
            --border-color: #E5E5E2;
            --pure-white: #FFFFFF;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            background-color: var(--bg-color);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--obsidian);
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            letter-spacing: 0.04em;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* Full-Viewport Minimalist Hero */
        header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
            position: relative;
        }

        .brand-subtitle {
            font-size: clamp(12px, 1.3vw, 16px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            color: var(--obsidian);
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(44px, 8.5vw, 115px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0;
            color: var(--tf-gold);
            line-height: 1;
        }

        .doc-title {
            font-size: 10px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--muted-text);
            margin-top: 26px;
        }

            position: absolute;
            bottom: 44px;
            display: flex;
            gap: 36px;
        }
